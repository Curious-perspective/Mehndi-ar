<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mehndi AR — live henna on your hands</title>
<meta name="theme-color" content="#1a0c06">
<style>
  :root { --henna: #7a2e0e; --cream: #fff3e2; --gold: #d9a441; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #1a0c06; color: var(--cream); font-family: Georgia, "Times New Roman", serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #video, #overlay, #photo { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  #photo { display: none; }
  .mirror { transform: scaleX(-1); }
  #overlay { pointer-events: none; mix-blend-mode: multiply; }

  #top { position: fixed; top: 0; left: 0; right: 0; padding: max(12px, env(safe-area-inset-top)) 16px 10px; background: linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,0)); display: flex; justify-content: space-between; align-items: center; z-index: 5; }
  #top h1 { margin: 0; font-size: 18px; font-weight: normal; letter-spacing: .5px; color: var(--cream); }
  #top h1 span { color: var(--gold); }
  #status { font-size: 12px; opacity: .85; }

  #bottom { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 12px max(14px, env(safe-area-inset-bottom)); background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.75)); z-index: 5; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  button { border: 1px solid rgba(255,243,226,.35); background: rgba(26,12,6,.55); color: var(--cream); padding: 9px 14px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; }
  button.on { background: var(--henna); border-color: var(--gold); }
  button.primary { background: var(--gold); color: #2a1206; border-color: var(--gold); font-weight: bold; padding: 11px 22px; }

  #gate { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 28px; background: radial-gradient(circle at 50% 30%, #3a1608, #1a0c06 70%); }
  #gate h2 { font-weight: normal; font-size: 26px; margin: 0; }
  #gate p { max-width: 420px; line-height: 1.5; opacity: .9; margin: 0; }
  #gate .alt { font-size: 13px; opacity: .7; }
  #fileIn { display: none; }
  #toast { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); background: rgba(0,0,0,.8); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .3s; z-index: 6; pointer-events: none; }
  #toast.show { opacity: 1; }
  #snapView { position: fixed; inset: 0; z-index: 20; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  #snapView img { max-width: 100%; max-height: 80%; }
  #snapView p { font-size: 13px; opacity: .8; margin: 0; }
</style>
</head>
<body>

<div id="stage">
  <video id="video" class="mirror" autoplay playsinline muted></video>
  <img id="photo" alt="">
  <canvas id="overlay" class="mirror"></canvas>
</div>

<div id="top">
  <h1>Mehndi <span>AR</span></h1>
  <div id="status">loading…</div>
</div>

<div id="bottom">
  <div class="row" id="styles">
    <button data-style="bridal" class="on">Bridal</button>
    <button data-style="mandala">Mandala</button>
    <button data-style="arabic">Arabic vine</button>
    <button data-style="minimal">Minimal</button>
  </div>
  <div class="row">
    <button id="shade">Shade: fresh</button>
    <button id="side">Side: auto</button>
    <button id="flip">Flip camera</button>
    <button id="snap" class="primary">Snap</button>
  </div>
</div>

<div id="gate">
  <h2>Mehndi AR</h2>
  <p>Hold any hand in front of the camera and watch the mehndi appear on it — palm, fingers and wrist, tracked live.</p>
  <button class="primary" id="start">Open camera</button>
  <p class="alt">No camera access? <a href="#" id="pickPhoto" style="color: var(--gold)">Use a photo instead</a></p>
  <input id="fileIn" type="file" accept="image/*">
</div>

<div id="toast"></div>
<div id="snapView"><img id="snapImg" alt="snapshot"><p>Long-press / right-click the image to save it</p><button id="snapClose">Back</button></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const video = $('video'), photo = $('photo'), canvas = $('overlay'), ctx = canvas.getContext('2d');
  const statusEl = $('status'), toastEl = $('toast');

  let styleName = 'bridal';
  let sideMode = 'auto';         // auto | palm | back
  let shade = 'fresh';            // fresh | dark
  let facing = 'user';
  let stream = null;
  let mode = 'live';              // live | photo
  let running = false;
  let smooth = [];                // smoothed landmarks per hand
  let lastSeen = 0;
  let busy = false;
  let FW = [0, 0, 0, 0, 0];      // per-finger widths for the hand being drawn
  let CURLED = [false, false, false, false, false];
  let modelReady = false;
  let photoSrc = null;          // downscaled canvas copy of the chosen photo
  let lastT = 0;

  const PALETTE = {
    fresh: { fill: 'rgba(122, 46, 14, 0.86)', line: 'rgba(104, 38, 10, 0.93)', deep: 'rgba(80, 26, 6, 0.97)' },
    dark:  { fill: 'rgba(70, 20, 5, 0.93)',   line: 'rgba(52, 14, 3, 0.97)',   deep: 'rgba(36, 8, 2, 1)' }
  };

  function toast(msg, ms = 2200) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove('show'), ms); }

  // ---------- MediaPipe Tasks: Hand Landmarker + skin segmentation ----------
  // Adapter keeps the old "hands.send / onResults" shape so the rest of the page is unchanged.
  const TV = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304';
  let HL = null, SEG = null, curMode = null;
  const hands = {
    async initialize() {
      const mod = await import(TV + '/vision_bundle.mjs');
      const fsr = await mod.FilesetResolver.forVisionTasks(TV + '/wasm');
      const mkHL = delegate => mod.HandLandmarker.createFromOptions(fsr, { baseOptions: { modelAssetPath: 'models/hand_landmarker.task', delegate }, runningMode: 'VIDEO', numHands: 2, minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5 });
      try { HL = await mkHL('GPU'); } catch (e) { HL = await mkHL('CPU'); }
      curMode = 'VIDEO';
      // skin model loads in the background; until it's ready the mask uses colour + hand shape
      const mkSEG = delegate => mod.ImageSegmenter.createFromOptions(fsr, { baseOptions: { modelAssetPath: 'models/selfie_multiclass_256x256.tflite', delegate }, runningMode: 'VIDEO', outputCategoryMask: true, outputConfidenceMasks: false });
      mkSEG('GPU').catch(() => mkSEG('CPU')).then(sg => { SEG = sg; if (curMode !== 'VIDEO') return SEG.setOptions({ runningMode: curMode }); }).catch(e => console.warn('skin model unavailable', e));
    },
    async send({ image }) {
      const isVideo = image instanceof HTMLVideoElement;
      const want = isVideo ? 'VIDEO' : 'IMAGE';
      if (want !== curMode) { await HL.setOptions({ runningMode: want }); if (SEG) await SEG.setOptions({ runningMode: want }); curMode = want; }
      const w = isVideo ? image.videoWidth : image.width, h = isVideo ? image.videoHeight : image.height;
      const ts = performance.now();
      const r = isVideo ? HL.detectForVideo(image, ts) : HL.detect(image);
      updateSkinMask(image, w, h, ts, isVideo, r.landmarks);
      // Tasks labels handedness the opposite way to the old Hands API; swap to keep isPalmFacing() calibrated
      onResults({ image: { width: w, height: h }, multiHandLandmarks: r.landmarks,
                  multiHandedness: r.handedness.map(c => ({ label: c[0].categoryName === 'Left' ? 'Right' : 'Left', score: c[0].score })) });
    }
  };
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.userAgent.includes('Mac') && 'ontouchend' in document);

  // ---------- skin mask: where ink may appear ----------
  // keep = (skin model says "not background") OR (colour matches this person's palm), inside a generous
  // hand+forearm region from the landmarks, with small holes closed. Errs towards showing ink.
  const MASK_W = 192;
  const mcan = document.createElement('canvas'), mctx = mcan.getContext('2d', { willReadFrequently: true });
  const maskCan = document.createElement('canvas'), maskCtx = maskCan.getContext('2d', { willReadFrequently: true });
  const artCan = document.createElement('canvas'), artCtx = artCan.getContext('2d');
  let maskValid = false;
  function updateSkinMask(image, w, h, ts, isVideo, hlms) {
    maskValid = false;
    if (styleName !== 'bridal' || !hlms.length || !w) return;
    const mw = MASK_W, mh = Math.max(1, Math.round(MASK_W * h / w)), N = mw * mh;
    if (mcan.width !== mw || mcan.height !== mh) { mcan.width = maskCan.width = mw; mcan.height = maskCan.height = mh; }
    mctx.drawImage(image, 0, 0, mw, mh);
    const d = mctx.getImageData(0, 0, mw, mh).data;
    const keep = new Uint8Array(N);
    // skin model classes: 0 background, 1 hair, 2 body skin, 3 face skin, 4 clothes, 5 other
    let cat = null;
    if (SEG) {
      try {
        const cb = res => { const a = res.categoryMask.getAsUint8Array(); cat = new Uint8Array(a.length); cat.set(a); for (let i = 0; i < a.length && i < N; i++) if (a[i] === 2 || a[i] === 3) keep[i] = 1; };
        if (isVideo) SEG.segmentForVideo(mcan, ts, cb); else SEG.segment(mcan, cb);
      } catch (e) { console.warn(e); }
    }
    // colour model sampled from the palm itself (adapts to skin tone and lighting every frame)
    const Ys = [], Crs = [], Cbs = [];
    for (const lm of hlms) for (const [i, j, t] of [[0, 9, 0.35], [0, 9, 0.6], [5, 17, 0.5], [0, 5, 0.5], [0, 17, 0.5], [0, 9, 0.15]]) {
      const cx = Math.round((lm[i].x + (lm[j].x - lm[i].x) * t) * mw), cy = Math.round((lm[i].y + (lm[j].y - lm[i].y) * t) * mh);
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const x = cx + dx, y = cy + dy; if (x < 0 || y < 0 || x >= mw || y >= mh) continue;
        const k = (y * mw + x) * 4, R = d[k], G = d[k + 1], B = d[k + 2], Y = 0.299 * R + 0.587 * G + 0.114 * B;
        Ys.push(Y); Crs.push((R - Y) * 0.713 + 128); Cbs.push((B - Y) * 0.564 + 128);
      }
    }
    const med = a => { const b = a.slice().sort((p, q) => p - q); return b[b.length >> 1] || 0; };
    if (Ys.length) {
      const mY = med(Ys), mCr = med(Crs), mCb = med(Cbs);
      for (let i = 0; i < N; i++) {
        const k = i * 4, R = d[k], G = d[k + 1], B = d[k + 2], Y = 0.299 * R + 0.587 * G + 0.114 * B;
        const Cr = (R - Y) * 0.713 + 128, Cb = (B - Y) * 0.564 + 128;
        if (cat && (cat[i] === 1 || cat[i] === 4)) continue;   // never paint on hair or sleeves, even if the colour is close
        if (Math.abs(Cr - mCr) < 11 && Math.abs(Cb - mCb) < 11 && Y > mY * 0.38 && Y < mY * 1.75 + 10) keep[i] = 1;
      }
    }
    // generous region: the warp mesh of each hand (art can't exist outside it anyway)
    maskCtx.clearRect(0, 0, mw, mh); maskCtx.fillStyle = '#fff';
    for (const lm of hlms) {
      const pts = lm.map(p => ({ x: p.x * mw, y: p.y * mh })), D = pts.concat(extraPts(pts));
      maskCtx.beginPath();
      for (const [a, b, c] of MESH.tri) { maskCtx.moveTo(D[a].x, D[a].y); maskCtx.lineTo(D[b].x, D[b].y); maskCtx.lineTo(D[c].x, D[c].y); maskCtx.closePath(); }
      maskCtx.fill('nonzero');
    }
    const reg = maskCtx.getImageData(0, 0, mw, mh);
    // close small holes: dilate twice, erode once (3x3)
    const morph = (src, dil) => { const o = new Uint8Array(N); for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) { let v = dil ? 0 : 1; for (let dy = -1; dy <= 1 && (dil ? !v : v); dy++) for (let dx = -1; dx <= 1; dx++) { const xx = x + dx, yy = y + dy; const s_ = (xx < 0 || yy < 0 || xx >= mw || yy >= mh) ? 0 : src[yy * mw + xx]; if (dil && s_) { v = 1; break; } if (!dil && !s_) { v = 0; break; } } o[y * mw + x] = v; } return o; };
    let m = morph(morph(keep, true), true); m = morph(m, false);
    // sanity check: the mask must cover the hand's own landmarks, otherwise (bad light, odd background) don't trust it
    let hit = 0, tot = 0;
    for (const lm of hlms) for (const k of [0, 1, 2, 5, 6, 9, 10, 13, 14, 17, 18]) {
      const x = Math.round(lm[k].x * mw), y = Math.round(lm[k].y * mh); if (x < 0 || y < 0 || x >= mw || y >= mh) continue;
      tot++; if (m[y * mw + x]) hit++;
    }
    if (!tot || hit / tot < 0.7) return;
    const rd = reg.data;
    for (let i = 0; i < N; i++) { const on = m[i] && rd[i * 4 + 3] > 0; rd[i * 4] = rd[i * 4 + 1] = rd[i * 4 + 2] = 255; rd[i * 4 + 3] = on ? 255 : 0; }
    maskCtx.putImageData(reg, 0, 0);
    maskValid = true;
  }

  function fitCanvas(w, h) { if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; } }

  function onResults(res) {
    const w = res.image.width, h = res.image.height;
    fitCanvas(w, h);
    ctx.clearRect(0, 0, w, h);
    const list = res.multiHandLandmarks || [];
    if (list.length) {
      lastSeen = performance.now();
      statusEl.textContent = list.length === 1 ? '1 hand' : `${list.length} hands`;
    } else if (performance.now() - lastSeen > 800) {
      statusEl.textContent = 'show a hand';
    }
    // exponential smoothing to kill jitter; each hand matched to its nearest previous wrist (MediaPipe does not keep a stable order)
    const alpha = mode === 'live' ? 0.55 : 1;
    const hd = res.multiHandedness || [];
    const out = list.map((lm, i) => {
      const wx = lm[0].x * w, wy = lm[0].y * h;
      let prev = null, best = Infinity;
      for (const sm of smooth) { const d = Math.hypot(sm.pts[0].x - wx, sm.pts[0].y - wy); if (d < best) { best = d; prev = sm; } }
      if (best > 0.15 * Math.max(w, h)) prev = null;
      const pts = lm.map((p, j) => {
        const x = p.x * w, y = p.y * h;
        return prev ? { x: prev.pts[j].x + (x - prev.pts[j].x) * alpha, y: prev.pts[j].y + (y - prev.pts[j].y) * alpha } : { x, y };
      });
      // palm/back: only trust confident handedness, and only switch after N consistent frames (MediaPipe's label flickers)
      const label = hd[i] ? hd[i].label : null, score = hd[i] ? hd[i].score : 0;
      // only trust a confident label, and only when the hand isn't edge-on (orientation signal near zero)
      const sinA = (() => { const w0 = pts[0], a0 = pts[5], b0 = pts[17]; const cr = (a0.x - w0.x) * (b0.y - w0.y) - (a0.y - w0.y) * (b0.x - w0.x); return cr / ((dist(w0, a0) * dist(w0, b0)) || 1); })();
      const raw = label && score > 0.7 && Math.abs(sinA) > 0.25 ? isPalmFacing(pts, label) : null;
      const hand = { pts, palm: prev ? prev.palm : (raw === null ? true : raw), cand: prev ? prev.cand : null, candN: prev ? prev.candN : 0 };
      const need = mode === 'live' ? 5 : 1;
      if (raw !== null && raw !== hand.palm) {
        if (hand.cand === raw) hand.candN++; else { hand.cand = raw; hand.candN = 1; }
        if (hand.candN >= need) { hand.palm = raw; hand.cand = null; hand.candN = 0; }
      } else if (raw === hand.palm) { hand.cand = null; hand.candN = 0; }
      return hand;
    });
    // hold the last drawing (landmarks AND side) through a single dropped frame
    smooth = out.length ? out : (performance.now() - lastSeen < 150 ? smooth : []);
    if (styleName === 'bridal') {
      if (artCan.width !== w || artCan.height !== h) { artCan.width = w; artCan.height = h; }
      artCtx.clearRect(0, 0, w, h);
      for (const hand of smooth) drawHand(hand);
      artCtx.save();
      artCtx.globalCompositeOperation = 'destination-in';
      if (maskValid) { artCtx.imageSmoothingEnabled = true; artCtx.drawImage(maskCan, 0, 0, w, h); }
      else { artCtx.fillStyle = '#fff'; for (const hand of smooth) { const L_ = hand.pts; artCtx.fill(handSilhouette(L_, dist(L_[5], L_[17]), dist(L_[0], L_[9]))); } }
      artCtx.restore();
      ctx.drawImage(artCan, 0, 0);
    } else for (const hand of smooth) drawHand(hand);
  }

  // ---------- geometry helpers ----------
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const lerp = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
  const ang = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);

  function dot(x, y, r, color) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill(); }

  function petalRing(cx, cy, r, n, rot, color, lw) {
    // n teardrop petals pointing outward from radius r*0.35 to r
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineJoin = 'round';
    for (let i = 0; i < n; i++) {
      const a = rot + (i / n) * Math.PI * 2;
      const s = { x: cx + Math.cos(a) * r * 0.35, y: cy + Math.sin(a) * r * 0.35 };
      const e = { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r };
      const px = -Math.sin(a), py = Math.cos(a);
      const bw = r * 0.22;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.quadraticCurveTo(e.x * 0.6 + s.x * 0.4 + px * bw, e.y * 0.6 + s.y * 0.4 + py * bw, e.x, e.y);
      ctx.quadraticCurveTo(e.x * 0.6 + s.x * 0.4 - px * bw, e.y * 0.6 + s.y * 0.4 - py * bw, s.x, s.y);
      ctx.stroke();
    }
  }

  function scallopRing(cx, cy, r, n, rot, color, lw) {
    ctx.strokeStyle = color; ctx.lineWidth = lw;
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a0 = rot + (i / n) * Math.PI * 2, a1 = rot + ((i + 1) / n) * Math.PI * 2, am = (a0 + a1) / 2;
      const p0 = { x: cx + Math.cos(a0) * r, y: cy + Math.sin(a0) * r };
      const p1 = { x: cx + Math.cos(a1) * r, y: cy + Math.sin(a1) * r };
      const c = { x: cx + Math.cos(am) * r * 1.22, y: cy + Math.sin(am) * r * 1.22 };
      if (i === 0) ctx.moveTo(p0.x, p0.y);
      ctx.quadraticCurveTo(c.x, c.y, p1.x, p1.y);
    }
    ctx.stroke();
  }

  function dotRing(cx, cy, r, n, rot, rad, color) {
    for (let i = 0; i < n; i++) { const a = rot + (i / n) * Math.PI * 2; dot(cx + Math.cos(a) * r, cy + Math.sin(a) * r, rad, color); }
  }

  function thickSegment(a, b, w, color) {
    ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }

  // leaves alternating along a polyline a→b→c (finger)
  function vine(points, width, color, lw, leaves = true) {
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
    ctx.stroke();
    if (!leaves) return;
    let side = 1;
    for (let i = 0; i < points.length - 1; i++) {
      const a = points[i], b = points[i + 1];
      const L = dist(a, b); if (L < 4) continue;
      const nLeaves = Math.max(1, Math.round(L / (width * 1.6)));
      for (let k = 0; k < nLeaves; k++) {
        const t = (k + 0.5) / nLeaves;
        const p = lerp(a, b, t);
        const th = ang(a, b) + side * Math.PI / 2;
        const tip = { x: p.x + Math.cos(th) * width * 0.55, y: p.y + Math.sin(th) * width * 0.55 };
        const fwd = ang(a, b);
        const bw = width * 0.22;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.quadraticCurveTo(p.x + Math.cos(fwd) * bw + Math.cos(th) * width * 0.3, p.y + Math.sin(fwd) * bw + Math.sin(th) * width * 0.3, tip.x, tip.y);
        ctx.quadraticCurveTo(p.x - Math.cos(fwd) * bw + Math.cos(th) * width * 0.3, p.y - Math.sin(fwd) * bw + Math.sin(th) * width * 0.3, p.x, p.y);
        ctx.fillStyle = color; ctx.fill();
        side = -side;
      }
    }
  }

  function diamondChain(a, b, w, color, lw) {
    const th = ang(a, b), L = dist(a, b), n = Math.max(2, Math.round(L / (w * 0.9)));
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineJoin = 'round';
    for (let k = 0; k < n; k++) {
      const p = lerp(a, b, (k + 0.5) / n), r = w * 0.36;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(th);
      ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(0, -r * 0.8); ctx.lineTo(r, 0); ctx.lineTo(0, r * 0.8); ctx.closePath(); ctx.stroke();
      ctx.restore();
    }
    dot(a.x, a.y, lw * 1.4, color); dot(b.x, b.y, lw * 1.4, color);
  }

  function paisley(cx, cy, size, rot, color, lw) {
    // classic ambi / mango shape
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
    ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(0, size * 0.5);

  function halfSun(cx, cy, r, dirSign, P, lw) {
    const a0 = dirSign > 0 ? -Math.PI / 2 : Math.PI / 2, a1 = a0 + Math.PI;
    const ring = (rr, w) => { ctx.strokeStyle = P.line; ctx.lineWidth = w; ctx.beginPath(); ctx.arc(cx, cy, rr, a0, a1); ctx.stroke(); };
    ctx.fillStyle = P.deep; ctx.beginPath(); ctx.arc(cx, cy, r * 0.16, a0, a1); ctx.closePath(); ctx.fill();
    ring(r * 0.24, lw);
    ctx.fillStyle = P.fill;
    const nT = 11;
    for (let k = 0; k < nT; k++) {
      const t0 = a0 + (k / nT) * Math.PI, t1 = a0 + ((k + 1) / nT) * Math.PI, tm = (t0 + t1) / 2;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(t0) * r * 0.28, cy + Math.sin(t0) * r * 0.28);
      ctx.lineTo(cx + Math.cos(tm) * r * 0.46, cy + Math.sin(tm) * r * 0.46);
      ctx.lineTo(cx + Math.cos(t1) * r * 0.28, cy + Math.sin(t1) * r * 0.28);
      ctx.closePath(); ctx.fill();
    }
    ring(r * 0.5, lw * 1.6);
    const nP = 13;
    for (let k = 0; k < nP; k++) {
      const t = a0 + ((k + 0.5) / nP) * Math.PI, px = -Math.sin(t), py = Math.cos(t);
      const s = { x: cx + Math.cos(t) * r * 0.55, y: cy + Math.sin(t) * r * 0.55 };
      const e = { x: cx + Math.cos(t) * r * 0.82, y: cy + Math.sin(t) * r * 0.82 };
      const bw = r * 0.09;
      ctx.beginPath(); ctx.moveTo(s.x, s.y);
      ctx.quadraticCurveTo((s.x + e.x) / 2 + px * bw, (s.y + e.y) / 2 + py * bw, e.x, e.y);
      ctx.quadraticCurveTo((s.x + e.x) / 2 - px * bw, (s.y + e.y) / 2 - py * bw, s.x, s.y);
      ctx.strokeStyle = P.line; ctx.lineWidth = lw; ctx.stroke();
      if (k % 2 === 0) { ctx.fillStyle = P.fill; ctx.fill(); }
    }
    ring(r * 0.86, lw);
    const nD = 17;
    for (let k = 0; k < nD; k++) { const t = a0 + ((k + 0.5) / nD) * Math.PI; dot(cx + Math.cos(t) * r * 0.95, cy + Math.sin(t) * r * 0.95, lw * 1.25, P.line); }
  }

  // layered wrist cuff in the local frame (wrist at x=0, forearm towards -x). half = half-width in scale units
  function cuff(half, P, lw, bands) {
    const line = (x, w) => thickSegment({ x, y: -half }, { x, y: half }, w, P.line);
    let x = -0.03;
    for (const b of bands) {
      if (b === 'thick') { line(x, lw * 2.4); x -= 0.05; }
      else if (b === 'thin') { line(x, lw); x -= 0.035; }
      else if (b === 'dots') { const n = 9; for (let k = 0; k < n; k++) dot(x, -half + (k + 0.5) / n * half * 2, lw * 1.3, P.line); x -= 0.05; }
      else if (b === 'scallop') {
        const n = 7; ctx.strokeStyle = P.line; ctx.lineWidth = lw; ctx.beginPath();
        for (let k = 0; k < n; k++) { const y0 = -half + k / n * half * 2, y1 = -half + (k + 1) / n * half * 2; if (k === 0) ctx.moveTo(x, y0); ctx.quadraticCurveTo(x - 0.05, (y0 + y1) / 2, x, y1); }
        ctx.stroke(); x -= 0.07;
      }
      else if (b === 'teeth') {
        const n = 9; ctx.fillStyle = P.fill;
        for (let k = 0; k < n; k++) { const y0 = -half + k / n * half * 2, y1 = -half + (k + 1) / n * half * 2; ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x - 0.05, (y0 + y1) / 2); ctx.lineTo(x, y1); ctx.closePath(); ctx.fill(); }
        x -= 0.06;
      }
    }
    return x;
  }

  // ---------- mehndi lettering: hand-drawn stroke glyphs on a 4 x 6 grid ----------
  const GLYPHS = {
    A: [[[0,6],[2,0],[4,6]], [[0.9,3.6],[3.1,3.6]]],
    K: [[[0,0],[0,6]], [[4,0],[0,3.4]], [[1.3,2.5],[4,6]]],
    S: [[[4,1],[3,0],[1,0],[0,1],[0,2.2],[1,3],[3,3],[4,3.8],[4,5],[3,6],[1,6],[0,5]]],
    H: [[[0,0],[0,6]], [[4,0],[4,6]], [[0,3],[4,3]]],
    Y: [[[0,0],[2,3]], [[4,0],[2,3],[2,6]]],
    W: [[[0,0],[0.8,6],[2,2.2],[3.2,6],[4,0]]],
    E: [[[4,0],[0,0],[0,6],[4,6]], [[0,3],[3,3]]],
    D: [[[0,0],[0,6],[2,6],[3.4,5],[4,3],[3.4,1],[2,0],[0,0]]],
    R: [[[0,6],[0,0],[3,0],[4,1],[4,2],[3,3],[0,3]], [[1.6,3],[4,6]]],
    ' ': []
  };

  // draws text centred at (cx,cy) in image space. up = unit vector pointing up the hand; mirror flips glyphs
  // so the text reads correctly on a mirrored (selfie) display. h = letter height in px.
  function mehndiText(str, cx, cy, up, h, mirror, color, lw) {
    const right = { x: -up.y, y: up.x };            // screen-right when the hand points up
    const dirX = mirror ? { x: -right.x, y: -right.y } : right;
    const gw = h * 0.62, gap = h * 0.22;
    const total = str.length * gw + (str.length - 1) * gap;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.transform(dirX.x, dirX.y, -up.x, -up.y, 0, 0);  // local x → along the text, local y → down the hand
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw;
    let x = -total / 2;
    const gx2 = gx => (mirror ? (4 - gx) : gx) / 4 * gw;
    for (const ch of str) {
      const g = GLYPHS[ch] || [];
      for (const stroke of g) {
        ctx.beginPath();
        stroke.forEach(([gx, gy], i) => { const px = x + gx2(gx), py = (gy / 6 - 0.5) * h; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
        ctx.stroke();
        for (const [gx, gy] of [stroke[0], stroke[stroke.length - 1]]) dot(x + gx2(gx), (gy / 6 - 0.5) * h, lw * 0.75, color);
      }
      x += gw + gap;
    }
    ctx.restore();
  }

  // ---------- BRIDAL: palm side ----------
  function drawBridalPalm(lm, scale, palmWidth, fingerW, P, lw) {
    FINGERS.forEach((f, i) => denseFinger(lm, f, i, FW[i], P, lw, CURLED[i]));
    const W = palmWidth / scale;                        // palm width in scale units (~0.8)
    const mirror = mode === 'live' && facing === 'user';
    const rot = ang(lm[0], lm[9]), up = { x: Math.cos(rot), y: Math.sin(rot) };

    const l = lw / scale;
    withHandFrame(lm, scale, () => {
      // scalloped row just under the knuckles
      ctx.strokeStyle = P.line; ctx.lineWidth = l; ctx.beginPath();
      const n = 6, y0 = -W * 0.5, y1 = W * 0.5, xs = 0.86;
      for (let k = 0; k < n; k++) { const a = y0 + k / n * (y1 - y0), b = y0 + (k + 1) / n * (y1 - y0); if (!k) ctx.moveTo(xs, a); ctx.quadraticCurveTo(xs - 0.07, (a + b) / 2, xs, b); }
      ctx.stroke();
      for (let k = 0; k <= n; k++) dot(xs + 0.03, y0 + k / n * (y1 - y0), l * 1.2, P.line);
      // thenar lattice on the thumb side, beside the frame (the hand clip trims it to the skin)
      ctx.save();
      ctx.beginPath(); ctx.moveTo(0.2, W * 0.44); ctx.lineTo(0.84, W * 0.44); ctx.lineTo(0.84, W * 0.75); ctx.lineTo(0.2, W * 0.75); ctx.closePath(); ctx.clip();
      for (let x = 0.2; x <= 0.86; x += 0.07) thickSegment({ x, y: W * 0.42 }, { x, y: W * 0.8 }, l * 0.8, P.line);
      for (let y = W * 0.44; y <= W * 0.8; y += 0.07) thickSegment({ x: 0.18, y }, { x: 0.86, y }, l * 0.8, P.line);
      ctx.restore();
      // name frame: double rectangle with corner dots
      const fx0 = 0.4, fx1 = 0.82, fy = W * 0.4;
      ctx.strokeStyle = P.line; ctx.lineWidth = l;
      ctx.strokeRect(fx0, -fy, fx1 - fx0, fy * 2);
      ctx.lineWidth = l * 0.7; ctx.strokeRect(fx0 + 0.022, -fy + 0.022, fx1 - fx0 - 0.044, fy * 2 - 0.044);
      for (const x of [fx0, fx1]) for (const y of [-fy, fy]) dot(x, y, l * 1.6, P.deep);
      // half-sun at the palm base, facing the fingers (stops short of the frame)
      halfSun(0.02, 0, Math.min(0.34, W * 0.42), 1, P, l);
      // wrist cuff + trailing half-sun on the forearm
      const endX = cuff(W * 0.62, P, l, ['thick', 'dots', 'scallop', 'thin', 'teeth', 'thick']);
      halfSun(endX - 0.04, 0, W * 0.36, -1, P, l);
      dot(endX - 0.04 - W * 0.36 - 0.06, 0, l * 1.8, P.deep);
    });

    // names inside the frame, screen-oriented so they read correctly; sized to fit the frame width
    const at = t => ({ x: lm[0].x + up.x * scale * t, y: lm[0].y + up.y * scale * t });
    const h = Math.min(0.1, (W * 0.8 * 0.86) / 4.82) * scale;   // 6 letters ≈ 4.82 letter-heights wide
    const c1 = at(0.745), c2 = at(0.61), c3 = at(0.475);
    mehndiText('AKSHAY', c1.x, c1.y, up, h, mirror, P.deep, Math.max(1, h * 0.12));
    mehndiText('WEDS', c2.x, c2.y, up, h * 0.62, mirror, P.line, Math.max(1, h * 0.09));
    mehndiText('SHREYA', c3.x, c3.y, up, h, mirror, P.deep, Math.max(1, h * 0.12));
  }

  // ---------- BRIDAL: back of the hand ----------
  function drawBridalBack(lm, scale, palmWidth, fingerW, P, lw) {
    FINGERS.forEach((f, i) => denseFinger(lm, f, i + 1, FW[i], P, lw, CURLED[i]));
    const W = palmWidth / scale;
    const l = lw / scale;
    withHandFrame(lm, scale, () => {
      // central flower
      const cx = 0.52, cy = 0, R = W * 0.42;
      dot(cx, cy, R * 0.1, P.deep);
      ctx.strokeStyle = P.line; ctx.lineWidth = l; ctx.beginPath(); ctx.arc(cx, cy, R * 0.2, 0, Math.PI * 2); ctx.stroke();
      const nP = 8;
      for (let k = 0; k < nP; k++) {
        const t = (k / nP) * Math.PI * 2, px = -Math.sin(t), py = Math.cos(t);
        const s = { x: cx + Math.cos(t) * R * 0.24, y: cy + Math.sin(t) * R * 0.24 }, e = { x: cx + Math.cos(t) * R * 0.66, y: cy + Math.sin(t) * R * 0.66 };
        const bw = R * 0.16;
        ctx.beginPath(); ctx.moveTo(s.x, s.y);
        ctx.quadraticCurveTo((s.x + e.x) / 2 + px * bw, (s.y + e.y) / 2 + py * bw, e.x, e.y);
        ctx.quadraticCurveTo((s.x + e.x) / 2 - px * bw, (s.y + e.y) / 2 - py * bw, s.x, s.y);
        ctx.strokeStyle = P.line; ctx.lineWidth = l; ctx.stroke();
        if (k % 2) { ctx.fillStyle = P.fill; ctx.fill(); } else dot((s.x + e.x) / 2, (s.y + e.y) / 2, l * 1.3, P.line);
      }
      ctx.beginPath(); ctx.arc(cx, cy, R * 0.72, 0, Math.PI * 2); ctx.lineWidth = l * 1.6; ctx.stroke();
      for (let k = 0; k < 20; k++) { const t = (k / 20) * Math.PI * 2; dot(cx + Math.cos(t) * R * 0.84, cy + Math.sin(t) * R * 0.84, l * 1.2, P.line); }
      ctx.lineWidth = l; ctx.beginPath();
      for (let k = 0; k < 16; k++) { const t0 = (k / 16) * Math.PI * 2, t1 = ((k + 1) / 16) * Math.PI * 2, tm = (t0 + t1) / 2; if (!k) ctx.moveTo(cx + Math.cos(t0) * R * 0.92, cy + Math.sin(t0) * R * 0.92); ctx.quadraticCurveTo(cx + Math.cos(tm) * R * 1.08, cy + Math.sin(tm) * R * 1.08, cx + Math.cos(t1) * R * 0.92, cy + Math.sin(t1) * R * 0.92); }
      ctx.stroke();
      // bel (vines) hugging both edges of the hand from the cuff up to the knuckles
      for (const sgn of [1, -1]) {
        const path = [{ x: 0.02, y: sgn * W * 0.5 }, { x: 0.3, y: sgn * W * 0.56 }, { x: 0.62, y: sgn * W * 0.52 }, { x: 0.9, y: sgn * W * 0.42 }];
        vine(path, W * 0.16, P.line, l);
      }
      cuff(W * 0.6, P, l, ['thin', 'scallop', 'thick']);
    });
    for (const i of [5, 9, 13, 17]) dot(lm[i].x, lm[i].y, lw * 1.8, P.deep);
  }

  function bandAcross(center, from, to, width, color, lw) {
    const a = ang(from, to); const d = { x: -Math.sin(a), y: Math.cos(a) };
    for (const off of [-0.12, 0.12]) {
      const c = { x: center.x + Math.cos(a) * width * off, y: center.y + Math.sin(a) * width * off };
      thickSegment({ x: c.x - d.x * width * 0.5, y: c.y - d.y * width * 0.5 }, { x: c.x + d.x * width * 0.5, y: c.y + d.y * width * 0.5 }, lw, color);
    }
  }

  function wristBand(lm, scale, palmWidth, P, lw, bold = false) {
    const rot = ang(lm[0], lm[9]);
    const d = { x: -Math.sin(rot), y: Math.cos(rot) };
    const f = { x: Math.cos(rot), y: Math.sin(rot) };
    const half = palmWidth * 0.6;
    // two lines slightly below the wrist landmark (towards forearm = opposite of f)
    for (const off of [0.02, 0.16]) {
      const c = { x: lm[0].x - f.x * scale * off, y: lm[0].y - f.y * scale * off };
      thickSegment({ x: c.x - d.x * half, y: c.y - d.y * half }, { x: c.x + d.x * half, y: c.y + d.y * half }, bold && off > 0.1 ? lw * 2.2 : lw, P.line);
    }
    // scallops between the lines
    const c = { x: lm[0].x - f.x * scale * 0.09, y: lm[0].y - f.y * scale * 0.09 };
    const n = 7;
    for (let i = 0; i < n; i++) {
      const t = (i + 0.5) / n - 0.5;
      const p = { x: c.x + d.x * half * 2 * t, y: c.y + d.y * half * 2 * t };
      dot(p.x, p.y, lw * 1.3, P.line);
    }
  }

  // ---------- camera / loop ----------
  async function startCamera() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    const constraints = { video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false };
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
    await new Promise(r => { const done = () => { video.removeEventListener('loadedmetadata', done); clearTimeout(t); r(); }; const t = setTimeout(done, 2000); video.addEventListener('loadedmetadata', done); });
    await video.play();
    const mirror = facing === 'user';
    video.classList.toggle('mirror', mirror); canvas.classList.toggle('mirror', mirror);
    mode = 'live'; photo.style.display = 'none'; video.style.display = '';
    if (!running) { running = true; loop(); }
  }

  async function loop() {
    const now = performance.now();
    if (mode === 'live' && modelReady && video.readyState >= 2 && !busy && now - lastT >= 33) {
      lastT = now; busy = true;
      try { await hands.send({ image: video }); } catch (e) { console.error(e); }
      busy = false;
    }
    requestAnimationFrame(loop);
  }

  async function usePhoto(file) {
    await ready;
    if (!modelReady) { toast('Hand-tracking model not loaded — check your connection', 3500); return; }
    const url = URL.createObjectURL(file);
    try { await new Promise((res, rej) => { photo.onload = res; photo.onerror = rej; photo.src = url; }); }
    catch (e) { toast('Could not open that image'); return; }
    // downscale: huge phone photos exceed GPU texture limits and iOS canvas memory
    const MAX = 1600, sc = Math.min(1, MAX / Math.max(photo.naturalWidth, photo.naturalHeight));
    photoSrc = document.createElement('canvas');
    photoSrc.width = Math.round(photo.naturalWidth * sc); photoSrc.height = Math.round(photo.naturalHeight * sc);
    photoSrc.getContext('2d').drawImage(photo, 0, 0, photoSrc.width, photoSrc.height);
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    mode = 'photo'; smooth = [];
    video.style.display = 'none'; photo.style.display = '';
    photo.classList.remove('mirror'); canvas.classList.remove('mirror');
    $('gate').style.display = 'none';
    statusEl.textContent = 'analysing photo…';
    await rerenderPhoto(true);
  }
  async function rerenderPhoto(report = false) {
    if (busy) return; busy = true;
    try { await hands.send({ image: photoSrc }); } catch (e) { console.error(e); if (report) toast('Could not analyse photo'); }
    busy = false;
  }

  // ---------- UI ----------
  $('start').addEventListener('click', async () => {
    statusEl.textContent = 'starting camera…';
    try {
      await startCamera();
      $('gate').style.display = 'none';
      statusEl.textContent = 'show a hand';
    } catch (e) {
      console.error(e);
      toast('Camera blocked — use a photo instead', 3500);
      statusEl.textContent = 'camera unavailable';
    }
  });
  $('pickPhoto').addEventListener('click', e => { e.preventDefault(); $('fileIn').click(); });
  $('fileIn').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) usePhoto(f).catch(() => toast('Could not use that photo')); });

  $('styles').addEventListener('click', e => {
    const b = e.target.closest('button[data-style]'); if (!b) return;
    styleName = b.dataset.style;
    [...$('styles').children].forEach(x => x.classList.toggle('on', x === b));
    if (mode === 'photo') rerenderPhoto();
  });
  $('side').addEventListener('click', () => {
    sideMode = sideMode === 'auto' ? 'palm' : sideMode === 'palm' ? 'back' : 'auto';
    $('side').textContent = `Side: ${sideMode}`;
    if (mode === 'photo') rerenderPhoto();
  });
  $('shade').addEventListener('click', () => {
    shade = shade === 'fresh' ? 'dark' : 'fresh';
    $('shade').textContent = `Shade: ${shade}`;
    if (mode === 'photo') rerenderPhoto();
  });
  $('flip').addEventListener('click', async () => {
    const prevFacing = facing;
    facing = facing === 'user' ? 'environment' : 'user';
    smooth = [];
    try { await startCamera(); }
    catch (e) { facing = prevFacing; toast('Could not switch camera'); try { await startCamera(); } catch (_) {} }
  });
  $('snap').addEventListener('click', () => {
    const src = mode === 'photo' ? photoSrc : video;
    const w = canvas.width, h = canvas.height; if (!w) return;
    const out = document.createElement('canvas'); out.width = w; out.height = h;
    const o = out.getContext('2d');
    const mirror = mode === 'live' && facing === 'user';
    if (mirror) { o.translate(w, 0); o.scale(-1, 1); }
    o.drawImage(src, 0, 0, w, h);
    o.globalCompositeOperation = 'multiply';
    o.drawImage(canvas, 0, 0);
    try {
      $('snapImg').src = out.toDataURL('image/jpeg', 0.92);
      $('snapView').style.display = 'flex';
    } catch (e) { toast('Snapshot failed'); }
  });
  $('snapClose').addEventListener('click', () => { $('snapView').style.display = 'none'; });

  // warm the model up on load so the first frame is quick
  const ready = hands.initialize()
    .then(() => { modelReady = true; statusEl.textContent = 'ready'; })
    .catch(e => { console.error(e); statusEl.textContent = 'model failed to load'; toast('Hand-tracking model failed to load — check your connection', 4000); });

  // iOS Safari freezes/mutes the camera track after app switch or lock — resume or re-acquire on return
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible' || mode !== 'live') return;
    const t = stream && stream.getVideoTracks()[0];
    if (!t || t.readyState === 'ended') startCamera().catch(() => {});
    else video.play().catch(() => startCamera().catch(() => {}));
  });
})();
</script>
</body>
</html>
